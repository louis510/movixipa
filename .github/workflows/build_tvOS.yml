name: Build Movix tvOS App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-tvos:
    name: Build tvOS Package (.ipa)
    runs-on: macos-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configurer Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Vérifier l'environnement Swift
        run: swift --version

      - name: Compiler pour tvOS (Simulator)
        run: |
          swift build --sdk $(xcrun --sdk appletvsimulator --show-sdk-path) --triple x86_64-apple-tvos-simulator

      - name: Créer le fichier .ipa non signé
        run: |
          # Créer la structure Payload requise pour un .ipa
          mkdir -p Payload/MovixTV.app
          
          # Chemin direct et précis du binaire généré pour le simulateur tvOS
          BINARY_PATH=".build/x86_64-apple-tvos-simulator/debug/MovixTV"
          
          if [ ! -f "$BINARY_PATH" ]; then
            echo "Erreur: Binaire introuvable à $BINARY_PATH"
            exit 1
          fi
          
          echo "Binaire trouvé à : $BINARY_PATH"
          cp "$BINARY_PATH" Payload/MovixTV.app/MovixTV
          
          # Créer l'archive .ipa (qui est un ZIP du dossier Payload)
          zip -r MovixTV.ipa Payload
          
          # Préparer un dossier propre pour l'upload
          mkdir -p build_output
          mv MovixTV.ipa build_output/

      - name: Sauvegarder l'artefact .ipa
        uses: actions/upload-artifact@v4
        with:
          name: MovixTV-IPA
          path: build_output/MovixTV.ipa
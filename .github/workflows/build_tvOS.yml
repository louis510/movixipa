name: Build Movix tvOS App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-tvos:
    name: Build tvOS Package
    runs-on: macos-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configurer Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Vérifier l'environnement Swift
        run: swift --version

      - name: Compiler pour tvOS (Simulator)
        run: |
          swift build --sdk $(xcrun --sdk appletvsimulator --show-sdk-path) --triple x86_64-apple-tvos-simulator

      - name: Préparer les artefacts de build
        run: |
          mkdir -p build_output
          cp -R .build/* build_output/

      - name: Sauvegarder les fichiers compilés
        uses: actions/upload-artifact@v4
        with:
          name: MovixTV-Build-Output
          path: build_output/
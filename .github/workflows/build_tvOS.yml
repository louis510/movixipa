name: tvOS IPA non signé

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**/*.swift'
      - 'Package.swift'
      - '.github/workflows/build_tvOS.yml'
  push:
    branches: [ "main", "master" ]
    tags:
      - 'tvos-v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compiler et empaqueter l'IPA tvOS non signée
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configurer Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Vérifier l'environnement Swift
        run: swift --version

      - name: Compiler pour tvOS (Simulator)
        run: |
          swift build --sdk $(xcrun --sdk appletvsimulator --show-sdk-path) --triple x86_64-apple-tvos-simulator

      - name: Créer le fichier .ipa non signé
        run: |
          mkdir -p Payload/MovixTV.app
          
          # Recherche universelle du binaire exécutable généré dans le dossier x86_64-apple-tvos-simulator/debug
          # (on prend le premier fichier exécutable sans extension trouvé)
          BINARY_PATH=$(find .build/x86_64-apple-tvos-simulator/debug -maxdepth 1 -type f ! -name "*.*" | head -n 1)
          
          if [ -z "$BINARY_PATH" ]; then
            echo "Erreur: Aucun binaire exécutable trouvé dans le dossier de build"
            find .build -type f
            exit 1
          fi
          
          echo "Binaire trouvé à : $BINARY_PATH"
          cp "$BINARY_PATH" Payload/MovixTV.app/MovixTV
          
          # Créer l'archive .ipa et son empreinte sha256
          zip -r MovixTV-unsigned.ipa Payload
          shasum -a 256 MovixTV-unsigned.ipa > MovixTV-unsigned.ipa.sha256
          
          mkdir -p build_output
          mv MovixTV-unsigned.ipa build_output/
          mv MovixTV-unsigned.ipa.sha256 build_output/

      - name: Téléverser le fichier IPA non signé
        uses: actions/upload-artifact@v4
        with:
          name: MovixTV-unsigned-${{ github.run_number }}
          path: |
            build_output/MovixTV-unsigned.ipa
            build_output/MovixTV-unsigned.ipa.sha256
          if-no-files-found: error
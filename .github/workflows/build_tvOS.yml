name: tvOS IPA non signé

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'tvos-v*'
  pull_request:
    branches: [ "main", "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compiler et empaqueter l'IPA tvOS non signée
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: 1. Récupérer le code source
        uses: actions/checkout@v4

      - name: 2. Configurer la version d'Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: 3. Vérifier la version de Swift
        run: swift --version

      - name: 4. Compiler pour le simulateur tvOS
        run: |
          swift build --sdk $(xcrun --sdk appletvsimulator --show-sdk-path) --triple x86_64-apple-tvos-simulator

      - name: 5. Créer la structure et le binaire de l'application tvOS
        run: |
          # Créer l'arborescence standard requise pour un .ipa (.app)
          mkdir -p Payload/MovixTV.app
          
          # Localiser automatiquement le binaire compilé
          BINARY_PATH=".build/x86_64-apple-tvos-simulator/debug/MovixTV"
          if [ ! -f "$BINARY_PATH" ]; then
            BINARY_PATH=$(find .build -name "MovixTV" -type f | head -n 1)
          fi
          
          if [ -z "$BINARY_PATH" ]; then
            echo "Erreur: Binaire MovixTV introuvable."
            exit 1
          fi
          
          echo "Binaire trouvé à : $BINARY_PATH"
          cp "$BINARY_PATH" Payload/MovixTV.app/MovixTV

      - name: 6. Générer le fichier Info.plist pour valider le bundle
        run: |
          cat << 'EOF' > Payload/MovixTV.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          dict>
              <key>CFBundleIdentifier</key>
              <string>com.movix.tvos</string>
              <key>CFBundleName</key>
              <string>MovixTV</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>MinimumOSVersion</key>
              <string>17.0</string>
              <key>UIDeviceFamily</key>
              <array>
                  <integer>3</integer>
              </array>
          </dict>
          </plist>
          EOF

      - name: 7. Empaqueter l'archive .ipa et calculer son SHA-256
        run: |
          # Compresser le dossier Payload en .ipa
          zip -r MovixTV-unsigned.ipa Payload
          
          # Générer le fichier de somme de contrôle SHA-256
          shasum -a 256 MovixTV-unsigned.ipa > MovixTV-unsigned.ipa.sha256
          
          # Ranger dans un dossier de sortie propre
          mkdir -p build_output
          mv MovixTV-unsigned.ipa build_output/
          mv MovixTV-unsigned.ipa.sha256 build_output/

      - name: 8. Téléverser les artefacts (.ipa et .sha256)
        uses: actions/upload-artifact@v4
        with:
          name: MovixTV-unsigned-${{ github.run_number }}
          path: |
            build_output/MovixTV-unsigned.ipa
            build_output/MovixTV-unsigned.ipa.sha256
          if-no-files-found: error
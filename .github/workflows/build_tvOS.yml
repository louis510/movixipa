name: Build Movix tvOS App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-tvos:
    name: Build tvOS Package
    runs-on: macos-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configurer Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Vérifier l'environnement Swift
        run: swift --version

      - name: Compiler pour tvOS (Simulator)
        run: |
          swift build -Xswiftc -sdk -Xswiftc $(xcrun --sdk appletvsimulator --show-sdk-path) -Xswiftc -target -Xswiftc x86_64-apple-tvos-simulator